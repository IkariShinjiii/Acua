<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACUA | Handcrafted by the Coast</title>
  <meta name="description"
    content="Handmade coastal accessories brand featuring singular 1-of-1 pieces, non-tarnish finishes, natural pearls, and bespoke commissions." />
  <meta name="theme-color" content="#AE431E" />

  <!-- Open Graph / Twitter Card: without these, a link shared in Messenger,
       Instagram DMs, WhatsApp, or iMessage — the channels this business
       actually sells through — shows as a bare, imageless link. Reuses the
       hero photo as a placeholder social preview image until dedicated
       branded artwork exists. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ACUA" />
  <meta property="og:title" content="ACUA | Handcrafted by the Coast" />
  <meta property="og:description"
    content="Handmade coastal accessories brand featuring singular 1-of-1 pieces, non-tarnish finishes, natural pearls, and bespoke commissions." />
  <meta property="og:url" content="https://acua-three.vercel.app/" />
  <meta property="og:image"
    content="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&h=630&q=85" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ACUA | Handcrafted by the Coast" />
  <meta name="twitter:description"
    content="Handmade coastal accessories brand featuring singular 1-of-1 pieces, non-tarnish finishes, natural pearls, and bespoke commissions." />
  <meta name="twitter:image"
    content="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&h=630&q=85" />

  <!-- Google Fonts: Libre Caslon Text, Manrope, Playfair Display & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Libre+Caslon+Text:wght@400;700&family=Manrope:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet">
  <script>
    // Runs before any stylesheet paints, so there's no flash of the wrong
    // theme. Defaults to light for a first-time visitor with nothing saved
    // yet (deliberately not following the OS preference) — dark mode only
    // turns on once someone has explicitly chosen it via the navbar toggle,
    // and that choice is what's remembered on their next visit.
    (function () {
      try {
        if (localStorage.getItem('acua-theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
</head>

<body class="bg-sand text-on-surface antialiased selection:bg-chile-rojo selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
