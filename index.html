<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <!-- Real logo mark, background-removed from the client's circular badge
       artwork. favicon.png is transparent (fine for a browser tab, which
       supplies its own backdrop); apple-touch-icon.png has an opaque
       chile-rojo backdrop, since iOS renders transparency as solid black
       on home-screen icons. -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <!-- The home hero is a CSS background-image, not an <img>, so the
       browser's preload scanner never finds it on its own — it would
       otherwise only start downloading once styles are resolved well
       into the render, well after this is almost certainly the page's
       largest contentful paint element. -->
  <link rel="preload" as="image" fetchpriority="high"
    href="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2000&q=85" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACUA | Handcrafted by the Coast</title>
  <meta name="description"
    content="Handmade coastal accessories brand featuring singular 1-of-1 pieces, non-tarnish finishes, natural pearls, and bespoke commissions." />
  <meta name="theme-color" content="#AE431E" />

  <!-- Open Graph / Twitter Card: without these, a link shared in Messenger,
       Instagram DMs, WhatsApp, or iMessage — the channels this business
       actually sells through — shows as a bare, imageless link.
       public/og-image.jpg is a 1200x630 branded card (hero photo, cream
       logo mark, wordmark, tagline). -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ACUA" />
  <meta property="og:title" content="ACUA | Handcrafted by the Coast" />
  <meta property="og:description"
    content="Handmade coastal accessories brand featuring singular 1-of-1 pieces, non-tarnish finishes, natural pearls, and bespoke commissions." />
  <meta property="og:url" content="https://acua-three.vercel.app/" />
  <meta property="og:image"
    content="https://acua-three.vercel.app/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ACUA | Handcrafted by the Coast" />
  <meta name="twitter:description"
    content="Handmade coastal accessories brand featuring singular 1-of-1 pieces, non-tarnish finishes, natural pearls, and bespoke commissions." />
  <meta name="twitter:image"
    content="https://acua-three.vercel.app/og-image.jpg" />

  <!-- Google Fonts: only the three families the site actually renders —
       Fraunces (font-serif), Inter (font-sans), Unica One (font-wordmark).
       Every stylesheet here blocks first paint, so unused families and the
       unused Material Symbols icon font were pure delay. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@300;400;500;600;700&family=Unica+One&display=swap"
    rel="stylesheet">
  <script>
    // Runs before any stylesheet paints, so there's no flash of the wrong
    // theme. Defaults to light for a first-time visitor with nothing saved
    // yet (deliberately not following the OS preference) — dark mode only
    // turns on once someone has explicitly chosen it via the navbar toggle,
    // and that choice is what's remembered on their next visit.
    (function () {
      try {
        if (localStorage.getItem('acua-theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Shown the instant HTML parses, before any JS/CSS has loaded, so it's
       styled inline. It's an exact copy of the wave preloader's first frame
       (src/components/Preloader.jsx: SAND_BEIGE background, olive mark at
       56px / 64px from 640px up), so React swapping it for the real
       preloader is invisible rather than a jump between two loaders. -->
  <style>
    #initial-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #E4D3AE;
    }
    #initial-loader .mark {
      width: 56px;
      height: 56px;
    }
    @media (min-width: 640px) {
      #initial-loader .mark {
        width: 64px;
        height: 64px;
      }
    }
  </style>

  <link rel="canonical" href="https://acua-three.vercel.app/" />
  <!-- Lets Google show the brand's name, logo and social profiles in
       search results instead of guessing them from page text. -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ACUA",
      "url": "https://acua-three.vercel.app/",
      "logo": "https://acua-three.vercel.app/apple-touch-icon.png",
      "description": "Handmade coastal accessories from Iloilo City, Philippines: 1-of-1 pieces, non-tarnish finishes, natural stones, and bespoke commissions.",
      "email": "acuavibe@gmail.com",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Iloilo City",
        "addressCountry": "PH"
      },
      "sameAs": [
        "https://www.instagram.com/acua_ph/",
        "https://www.tiktok.com/@acua_ph",
        "https://www.facebook.com/profile.php?id=61577296311917"
      ]
    }
  </script>
</head>

<body class="bg-sand text-on-surface antialiased selection:bg-chile-rojo selection:text-white">
  <div id="root">
    <!-- React's first render replaces everything inside #root, so this
         disappears the instant the app mounts — no removal code needed. -->
    <div id="initial-loader" aria-hidden="true">
      <img class="mark" src="/src/assets/logo-mark-olive.png" alt="" />
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
