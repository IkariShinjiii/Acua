<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <!-- Real logo mark, background-removed from the client's circular badge
       artwork. favicon.png is transparent (fine for a browser tab, which
       supplies its own backdrop); apple-touch-icon.png has an opaque
       chile-rojo backdrop, since iOS renders transparency as solid black
       on home-screen icons. -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <!-- The home hero is a CSS background-image, not an <img>, so the
       browser's preload scanner never finds it on its own — it would
       otherwise only start downloading once styles are resolved well
       into the render, well after this is almost certainly the page's
       largest contentful paint element. -->
  <link rel="preload" as="image" fetchpriority="high"
    href="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2000&q=85" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACUA | Handcrafted by the Coast</title>
  <meta name="description"
    content="Handmade coastal accessories brand featuring singular 1-of-1 pieces, non-tarnish finishes, natural pearls, and bespoke commissions." />
  <meta name="theme-color" content="#AE431E" />

  <!-- Open Graph / Twitter Card: without these, a link shared in Messenger,
       Instagram DMs, WhatsApp, or iMessage — the channels this business
       actually sells through — shows as a bare, imageless link. Reuses the
       hero photo as a placeholder social preview image until dedicated
       branded artwork exists. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ACUA" />
  <meta property="og:title" content="ACUA | Handcrafted by the Coast" />
  <meta property="og:description"
    content="Handmade coastal accessories brand featuring singular 1-of-1 pieces, non-tarnish finishes, natural pearls, and bespoke commissions." />
  <meta property="og:url" content="https://acua-three.vercel.app/" />
  <meta property="og:image"
    content="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&h=630&q=85" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ACUA | Handcrafted by the Coast" />
  <meta name="twitter:description"
    content="Handmade coastal accessories brand featuring singular 1-of-1 pieces, non-tarnish finishes, natural pearls, and bespoke commissions." />
  <meta name="twitter:image"
    content="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&h=630&q=85" />

  <!-- Google Fonts: Libre Caslon Text, Manrope, Playfair Display & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Libre+Caslon+Text:wght@400;700&family=Manrope:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Unica+One&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet">
  <script>
    // Runs before any stylesheet paints, so there's no flash of the wrong
    // theme. Defaults to light for a first-time visitor with nothing saved
    // yet (deliberately not following the OS preference) — dark mode only
    // turns on once someone has explicitly chosen it via the navbar toggle,
    // and that choice is what's remembered on their next visit.
    (function () {
      try {
        if (localStorage.getItem('acua-theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Preloader styling lives here, inline, rather than in the Tailwind
       bundle it's meant to cover the wait for — it has to be visible the
       instant HTML parses, with no dependency on the JS/CSS it's masking
       the load time of. -->
  <style>
    #initial-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: #F9F6F0;
    }
    html.dark #initial-loader {
      background: #1A1815;
    }
    #initial-loader .mark {
      height: 56px;
      width: auto;
      animation: initial-loader-pulse 1.6s ease-in-out infinite;
    }
    /* Ink mark on the light (default) background, cream mark once dark
       mode's class is present — same fixed-vs-theme-aware split the rest
       of the site's logo usages follow (see Navbar/HomeView footer). */
    #initial-loader .mark-dark { display: none; }
    html.dark #initial-loader .mark-light { display: none; }
    html.dark #initial-loader .mark-dark { display: block; }
    #initial-loader .bar {
      position: relative;
      width: 120px;
      height: 2px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(174, 67, 30, 0.15);
    }
    #initial-loader .bar::after {
      content: '';
      position: absolute;
      inset: 0;
      width: 40%;
      border-radius: 999px;
      background: #AE431E;
      animation: initial-loader-slide 1.2s ease-in-out infinite;
    }
    @keyframes initial-loader-pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    @keyframes initial-loader-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #initial-loader .mark,
      #initial-loader .bar::after {
        animation: none;
      }
    }
  </style>
</head>

<body class="bg-sand text-on-surface antialiased selection:bg-chile-rojo selection:text-white">
  <div id="root">
    <!-- React's first render replaces everything inside #root, so this
         disappears the instant the app mounts — no removal code needed. -->
    <div id="initial-loader" aria-hidden="true">
      <img class="mark mark-light" src="/src/assets/logo-mark-ink.png" alt="" />
      <img class="mark mark-dark" src="/src/assets/logo-mark-cream.png" alt="" />
      <div class="bar"></div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
